
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form đăng ký người dùng</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 25px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group > label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        .gender-options {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .gender-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        input[type="radio"] {
            accent-color: #3498db;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Đăng ký người dùng</h1>

        <form
            action="http://demo.codegym.vn/6/registration_form/register.php"
            method="POST"
        >
            <div class="form-group">
                <label for="name">Họ và tên</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Nhập họ và tên"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Nhập số điện thoại"
                    required
                >
            </div>

            <div class="form-group">
                <label>Giới tính</label>

                <div class="gender-options">
                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="male"
                            required
                        >
                        Nam
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="female"
                        >
                        Nữ
                    </label>
                </div>
            </div>

            <button type="submit">Đăng ký</button>
        </form>
    </div>
</body>
</html>
